<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In and Sign Up</title>
    <!-- <link rel="stylesheet" href="./CSS/font-awesome.5.13.0.all.min.css" /> -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <!-- <link rel="stylesheet" href="./CSS/font-awesome.7.0.1.all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"> -->
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <div class="container"><!-- Container Start -->
      <input type="checkbox" id="toggle"><!-- Toggle Checkbox -->
      <div class="signin"> <!-- Sign In Section Start -->
        <h1>Sign In</h1><!-- Sign In Heading -->
        <form><!-- Sign In Form Start -->
          <div class="social"> <!-- Social Media Icons -->
           <a href="#"><i class="fab fa-google-plus-g"></i></a>
           <a href="#"><i class="fab fa-facebook-f"></i></a>
           <a href="#"><i class="fab fa-linkedin"></i></a>
          </div>
          <p>Or use enter your email and password </p> <!-- Sign In Description -->
          <input type="email" placeholder="Email" required /><!-- Email Input Field -->
          <input type="password" placeholder="Password" required /><!-- Password Input Field -->
          <small>Forgot your password?</small><!-- Forgot Password Link -->
          <input type="submit" value="Login" /><!-- Login Button -->
          <small>Don't have an account? <label for="toggle"><!-- Switch to Sign Up Link -->
            Sign Up</label></small><!-- Switch to Sign Up Link -->
        </form>
      </div>
  </body>
</html>
