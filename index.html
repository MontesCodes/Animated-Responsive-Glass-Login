<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In and Sign Up</title>
    <!-- <link rel="stylesheet" href="./CSS/font-awesome.5.13.0.all.min.css" /> -->
          <link rel="stylesheet" href="./fontawesome-free-7.1.0-web/css/all.min.css" >
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <div class="container"><!-- Container Start -->
      <input type="checkbox" id="toggle"><!-- Toggle Checkbox -->
      <div class="signin"> <!-- Sign In Section Start -->
        <h1>Sign In</h1><!-- Sign In Heading -->
        <form><!-- Sign In Form Start -->
          <div class="social"> <!-- Social Media Icons -->
           <a href="#"><i class="fab fa-google-plus-g"></i></a>
           <a href="#"><i class="fab fa-facebook-f"></i></a>
           <a href="#"><i class="fab fa-linkedin"></i></a>
          </div>
          <p>Or use enter your email and password </p> <!-- Sign In Description -->
          <input type="email" placeholder="Email" required /><!-- Email Input Field -->
          <input type="password" placeholder="Password" required /><!-- Password Input Field -->
          <small>Forgot your password?</small><!-- Forgot Password Link -->
          <input type="submit" value="Login" /><!-- Login Button -->
          <small>Don't have an account? <label for="toggle"><!-- Switch to Sign Up Link -->
            Sign Up</label></small><!-- Switch to Sign Up Link -->
        </form>
      </div>
      <div class="signup"> <!-- Sign Up Section Start -->
        <h1>Create an Account</h1> <!-- Sign Up Heading -->
        <form> <!-- Sign Up Form Start -->
          <div class="social"> <!-- Social Media Icons -->
            <a href="https://gmail.com"><i class="fab fa-google-plus-g"></i></a> <!-- Google Plus Icon with link to Gmail -->
            <a href="https://facebook.com"><i class="fab fa-facebook-f"></i></a> <!-- Facebook Icon with link to Facebook -->
            <a href="https://linkedin.com"><i class="fab fa-linkedin-in"></i></a> <!-- LinkedIn Icon with link to LinkedIn -->
          </div>
          <p>Or use your email for registration</p> <!-- Sign Up Description -->
          <input type="text" placeholder="Name" required /> <!-- Name Input Field -->
          <input type="email" placeholder="Email" required /> <!-- Email Input Field -->
          <input type="password" placeholder="Password" required /> <!-- Password Input Field -->
          <input type="password" placeholder="Confirm Password" required /> <!-- Confirm Password Input Field -->
          <input type="submit" value="Create Account" /> <!-- Create Account Button -->
            <small>Already have an account? <label for="toggle">Sign In</label></small> <!-- Switch to Sign In Link -->
        </form>
      </div>
  </body>
</html>
